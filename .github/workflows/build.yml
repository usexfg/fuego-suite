name: Build

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install boost@1.85 openssl@3 icu4c jsoncpp cmake ninja

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DOPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Test
        working-directory: build
        run: |
          for test in test_adaptor_roundtrip test_price_oracle_arb test_swap_hashlock \
            test_sol_htlc_address test_monero_address test_xmr_keys test_xmr_sweep_sequence \
            XmrClaimAdaptorTests; do
            echo "=== $test ==="
            ./src/$test
          done
