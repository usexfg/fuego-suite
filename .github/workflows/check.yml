name: Build check

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*"
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install msbuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Install OpenSSL
        shell: powershell
        run: |
          choco install openssl -y
          echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64" >> $env:GITHUB_ENV

      - name: Download and Install Boost 1.85
        shell: powershell
        run: |
          $Url = "https://archives.boost.io/release/1.85.0/source/boost_1_85_0.zip"
          $Zip  = "$env:TEMP\boost.zip"
          Invoke-WebRequest -Uri $Url -OutFile $Zip
          Expand-Archive -Path $Zip -DestinationPath C:\boost -Force
          echo "BOOST_ROOT=C:\boost\boost_1_85_0" >> $env:GITHUB_ENV
          echo "BOOST_LIBRARYDIR=C:\boost\boost_1_85_0\stage\lib" >> $env:GITHUB_ENV

      - name: Build Boost libraries
        shell: powershell
        run: |
          cd C:\boost\boost_1_85_0
          .\bootstrap.bat
          .\b2 --with-filesystem --with-thread --with-date_time --with-chrono `
              --with-regex --with-serialization --with-program_options `
              --with-coroutine --with-context --with-atomic `
              link=static runtime-link=static threading=multi address-model=64 -j4 stage

      - name: Build
        shell: powershell
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 `
            -DBOOST_ROOT="$env:BOOST_ROOT" `
            -DBOOST_LIBRARYDIR="$env:BOOST_LIBRARYDIR" `
            -DBoost_NO_BOOST_CMAKE=ON `
            -DBoost_USE_STATIC_LIBS=ON `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" ..
          msbuild fuegoX.sln /p:Configuration=Release /m

  build-ubuntu24:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-all-dev libssl-dev libicu-dev libjsoncpp-dev

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          make -C build -j$(nproc)

  build-macos:
    name: macOS
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-13
            arch: intel
            brew_prefix: /usr/local
          - os: macos-14
            arch: apple
            brew_prefix: /opt/homebrew
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install boost@1.85 openssl@3 icu4c jsoncpp cmake ninja

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch == 'intel' && 'x86_64' || 'arm64' }} \
            -DOPENSSL_ROOT_DIR=${{ matrix.brew_prefix }}/opt/openssl@3
          cmake --build build -j$(sysctl -n hw.logicalcpu)
