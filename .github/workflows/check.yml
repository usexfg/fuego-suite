name: Build check

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*"
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake 3.31
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Install OpenSSL
        run: choco install openssl -y

      - name: Install Boost 1.85
        shell: powershell
        run: |
          $Url = "https://archives.boost.io/release/1.85.0/binaries/boost_1_85_0-msvc-14.3-64.exe"
          $Exe  = "$env:TEMP\boost.exe"
          Invoke-WebRequest -Uri $Url -OutFile $Exe
          Start-Process -Wait -FilePath $Exe "/SILENT","/SP-","/SUPPRESSMSGBOXES","/DIR=C:\boost"
          echo "BOOST_ROOT=C:\boost" >> $env:GITHUB_ENV

      - name: Build
        shell: powershell
        run: |
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build" -G "Visual Studio 17 2022" -A x64 `
            -DBOOST_ROOT="$env:BOOST_ROOT" `
            -DOPENSSL_ROOT_DIR="C:/Program Files/OpenSSL-Win64"
          cmake --build "${{ github.workspace }}/build" --config Release -j 4

  build-ubuntu24:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-all-dev libssl-dev libicu-dev libjsoncpp-dev

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          make -C build -j$(nproc)

  build-macos:
    name: macOS
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-13
            arch: intel
            brew_prefix: /usr/local
          - os: macos-14
            arch: apple
            brew_prefix: /opt/homebrew
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install boost@1.85 openssl@3 icu4c jsoncpp cmake ninja

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch == 'intel' && 'x86_64' || 'arm64' }} \
            -DOPENSSL_ROOT_DIR=${{ matrix.brew_prefix }}/opt/openssl@3
          cmake --build build -j$(sysctl -n hw.logicalcpu)
