name: Build check

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*"
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install OpenSSL
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files\OpenSSL",
            "C:\Program Files\FireDaemon OpenSSL 3"
          )
          $openssl = $candidates | Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
          if (-not $openssl) {
            $found = Get-ChildItem -Path "C:\Program Files" -Filter "ssl.h" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $openssl = (Get-Item $found.FullName).Directory.Parent.Parent.FullName }
          }
          if (-not $openssl) {
            choco install openssl -y --no-progress
            $openssl = $candidates | Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
            if (-not $openssl) {
              $found = Get-ChildItem -Path "C:\Program Files" -Filter "ssl.h" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $openssl = (Get-Item $found.FullName).Directory.Parent.Parent.FullName }
            }
          }
          if (-not $openssl) { throw "OpenSSL not found" }
          $inc = Join-Path $openssl "include"
          Write-Host "OPENSSL_ROOT_DIR=$openssl"
          Write-Host "OPENSSL_INCLUDE_DIR=$inc"
          echo "OPENSSL_ROOT_DIR=$openssl" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$inc" >> $env:GITHUB_ENV

      - name: Install Boost 1.85
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $Url = "https://archives.boost.io/release/1.85.0/binaries/boost_1_85_0-msvc-14.3-64.exe"
          Invoke-WebRequest -Uri $Url -OutFile "$env:TEMP\boost.exe" -UseBasicParsing
          Start-Process -Wait "$env:TEMP\boost.exe" -ArgumentList "/SILENT","/SP-","/SUPPRESSMSGBOXES","/DIR=C:\boost"
          echo "BOOST_ROOT=C:\boost" >> $env:GITHUB_ENV

      - name: Install jsoncpp
        shell: pwsh
        run: vcpkg install jsoncpp:x64-windows openssl:x64-windows

      - name: Build
        shell: pwsh
        run: |
          $vcpkgDir = if (Test-Path "C:\vcpkg") { "C:\vcpkg" } else { "$env:VCPKG_INSTALLATION_ROOT" }
          $toolchain = Join-Path $vcpkgDir "scripts/buildsystems/vcpkg.cmake"
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build" -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DBOOST_ROOT="C:\boost" `
            -DBOOST_LIBRARYDIR="C:\boost\lib" `
            -DBOOST_INCLUDEDIR="C:\boost\include\boost-1_85" `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" `
            -DOPENSSL_INCLUDE_DIR="$env:OPENSSL_INCLUDE_DIR"
          cmake --build "${{ github.workspace }}/build" --config Release -j $env:NUMBER_OF_PROCESSORS

  build-ubuntu24:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-all-dev libssl-dev libicu-dev libjsoncpp-dev libsecp256k1-dev ninja-build
          
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DUSE_VENDORED_SECP256K1=OFF -G Ninja
          cmake --build build -j$(nproc)

      - name: Unit and regression tests
        run: |
          ./build/src/audit_regression_tests
          ./build/src/test_hearth_amm
          ./build/src/test_daemons/core_tests
          ./build/src/test_daemons/test_orderbook
          ./build/src/test_daemons/test_orderbook_auction
          ./build/src/test_daemons/test_orderbook_phase3
          ./build/src/test_daemons/test_orderbook_phase5

      # Consensus scenarios replayed through a real core. The slow tier
      # (--include-slow, gen_block_invalid_binary_format) is not run here.
      - name: Chaingen consensus scenarios
        run: |
          status=0
          ./build/src/chaingen_tests --generate_and_play_test_data \
            --data-dir "$RUNNER_TEMP/chaingen" > "$RUNNER_TEMP/chaingen.log" 2>&1 || status=$?
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/chaingen.log" | grep -a -E '#TEST#|Test run:|Failures:|FAILED TESTS|^  [A-Za-z]'
          if [ "$status" -ne 0 ]; then tail -n 300 "$RUNNER_TEMP/chaingen.log"; fi
          exit "$status"

      - name: Upload Chaingen log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaingen-log
          path: ${{ runner.temp }}/chaingen.log

  sanitizers-ubuntu:
    name: Sanitizers (ASan+UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-all-dev libssl-dev libicu-dev libjsoncpp-dev libsecp256k1-dev ninja-build

      - name: Build with sanitizers
        run: |
          cmake -B build-san -DCMAKE_BUILD_TYPE=Debug -DUSE_VENDORED_SECP256K1=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -G Ninja
          cmake --build build-san -j$(nproc) --target CryptoNoteCore core_tests test_orderbook \
            audit_regression_tests test_hearth_amm test_orderbook_auction test_orderbook_phase3 test_orderbook_phase5

      - name: Run core tests under sanitizers
        run: |
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1
          ./build-san/src/test_daemons/core_tests
          ./build-san/src/test_daemons/test_orderbook
          ./build-san/src/audit_regression_tests
          ./build-san/src/test_hearth_amm
          ./build-san/src/test_daemons/test_orderbook_auction
          ./build-san/src/test_daemons/test_orderbook_phase3
          ./build-san/src/test_daemons/test_orderbook_phase5

  build-macos:
    name: macOS
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: apple
          - os: macos-15
            arch: apple
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install boost openssl@3 icu4c jsoncpp secp256k1 cmake ninja

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBOOST_ROOT="$(brew --prefix boost)" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DICU_ROOT="$(brew --prefix icu4c)" \
            -DUSE_VENDORED_SECP256K1=OFF
          cmake --build build -j$(sysctl -n hw.logicalcpu)
