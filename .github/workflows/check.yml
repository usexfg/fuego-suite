name: Build check

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*"
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install msbuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Install OpenSSL
        shell: powershell
        run: |
          choco install openssl -y
          echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64" >> $env:GITHUB_ENV

      - name: Download and Install Boost 1.85
        shell: powershell
        run: |
          $Url = "https://sourceforge.net/projects/boost/files/boost-binaries/1.85.0/boost_1_85_0-msvc-14.3-64.exe/download"
          $OutputPath = "$env:TEMP\boost-installer.exe"
          Invoke-WebRequest -Uri $Url -OutFile $OutputPath
          Start-Process -Wait -FilePath $OutputPath "/SILENT","/SP-","/SUPPRESSMSGBOXES","/DIR=C:\thirdparties\boost-1.85.0"
          echo "BOOST_ROOT=C:\thirdparties\boost-1.85.0" >> $env:GITHUB_ENV
          echo "BOOST_INCLUDE_DIRS=C:\thirdparties\boost-1.85.0\include" >> $env:GITHUB_ENV

      - name: Build
        shell: powershell
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 `
            -DBOOST_ROOT="$env:BOOST_ROOT" `
            -DBOOST_INCLUDE_DIRS="$env:BOOST_INCLUDE_DIRS" `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" ..
          msbuild fuegoX.sln /p:Configuration=Release /m

  build-ubuntu24:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-all-dev libssl-dev libicu-dev libjsoncpp-dev

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          make -C build -j$(nproc)

  build-macos:
    name: macOS
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-13
            arch: intel
            brew_prefix: /usr/local
          - os: macos-14
            arch: apple
            brew_prefix: /opt/homebrew
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install boost openssl@3 icu4c jsoncpp cmake ninja

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch == 'intel' && 'x86_64' || 'arm64' }} \
            -DOPENSSL_ROOT_DIR=${{ matrix.brew_prefix }}/opt/openssl@3
          cmake --build build -j$(sysctl -n hw.logicalcpu)
