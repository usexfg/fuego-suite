name: Build check

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*"
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CMake 3.31
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"

      - name: Install OpenSSL (choco)
        run: choco install openssl -y

      - name: Install Boost (vcpkg)
        run: |
          vcpkg install boost-asio boost-filesystem boost-thread boost-date-time boost-chrono boost-regex boost-serialization boost-program-options boost-coroutine boost-context boost-atomic --triplet x64-windows-static

      - name: Build
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DOPENSSL_ROOT_DIR="C:/Program Files/OpenSSL-Win64"
          cmake --build build --config Release -j 4

  build-ubuntu24:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-all-dev libssl-dev libicu-dev libjsoncpp-dev

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          make -C build -j$(nproc)

  build-macos:
    name: macOS
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-13
            arch: intel
            brew_prefix: /usr/local
          - os: macos-14
            arch: apple
            brew_prefix: /opt/homebrew
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install boost@1.85 openssl@3 icu4c jsoncpp cmake ninja

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch == 'intel' && 'x86_64' || 'arm64' }} \
            -DOPENSSL_ROOT_DIR=${{ matrix.brew_prefix }}/opt/openssl@3
          cmake --build build -j$(sysctl -n hw.logicalcpu)
