name: Docker Images

on:
  push:
    tags:
      - "*"

jobs:
  build-docker:
    name: Docker Multi-Arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.colinritman }}
          password: ${{ secrets.dckr_pat_9CkW7wqzfP-RMWpji4ZkDJDU9xs }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            fuego/fuego
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM ubuntu:22.04 as builder

          RUN apt-get update && apt-get install -y \
              build-essential cmake libboost-all-dev \
              libssl-dev libicu-dev libjsoncpp-dev git \
              && rm -rf /var/lib/apt/lists/*

          WORKDIR /src
          COPY . .

          RUN cmake -B build -DCMAKE_BUILD_TYPE=Release && \
              make -C build -j$(nproc)

          FROM ubuntu:22.04

          RUN apt-get update && apt-get install -y \
              libboost-filesystem1.74.0 libboost-thread1.74.0 \
              libboost-date-time1.74.0 libboost-chrono1.74.0 \
              libboost-regex1.74.0 libboost-serialization1.74.0 \
              libboost-program-options1.74.0 libboost-coroutine1.74.0 \
              libboost-context1.74.0 libboost-atomic1.74.0 \
              libssl3 libicu70 libjsoncpp25 ca-certificates \
              && rm -rf /var/lib/apt/lists/*

          COPY --from=builder /src/build/src/fuegod /usr/local/bin/
          COPY --from=builder /src/build/src/fuego-wallet-cli /usr/local/bin/
          COPY --from=builder /src/build/src/walletd /usr/local/bin/

          RUN useradd -m -u 1000 fuego
          USER fuego
          WORKDIR /home/fuego
          RUN mkdir -p /home/fuego/.fuego
          VOLUME ["/home/fuego/.fuego"]

          EXPOSE 20808 28180
          ENTRYPOINT ["fuegod"]
          CMD ["--data-dir=/home/fuego/.fuego"]
          EOF

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
