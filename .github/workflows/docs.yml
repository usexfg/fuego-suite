name: Docs check

on:
  push:
    paths:
      - "docs/**"
      - "tests/docs/**"
      - "src/CryptoNoteConfig.h"
      - "src/SwapDaemon/SwapPairCatalog.h"
      - "src/SwapDaemon/AssetCatalog.cpp"
      - "scripts/gen-dexfg-chain-table.py"
      - "scripts/probe-feed-ids.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tests/docs/**"
      - "src/CryptoNoteConfig.h"
      - "src/SwapDaemon/SwapPairCatalog.h"
      - "src/SwapDaemon/AssetCatalog.cpp"
      - "scripts/gen-dexfg-chain-table.py"
      - "scripts/probe-feed-ids.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docs-alignment:
    name: Fee + product docs alignment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run docs fee/routing alignment tests
        run: python3 tests/docs/test_docs_fee_routing_alignment.py

      - name: DeXFG chain table matches the pair catalog
        run: python3 scripts/gen-dexfg-chain-table.py --check

  feed-identity:
    name: Price feed identity (report only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unpriced assets' candidate feed ids (remediation plan 3.1, 3.2)
        run: python3 scripts/probe-feed-ids.py coingecko:peaq-2 coingecko:peaq coingecko:peaq-network coingecko:gleec-coin

      - name: Live audit of the priced asset matrix
        continue-on-error: true
        run: python3 scripts/verify-defillama-assets.py

  mintlify-validate:
    name: Mintlify validate + broken links
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Mintlify validate
        run: npx --yes mint@latest validate

      - name: Mintlify broken-links
        run: npx --yes mint@latest broken-links
