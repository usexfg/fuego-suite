name: Raspberry Pi ARM64

on:
  push:
    tags:
      - "*"

jobs:
  build-raspberry-pi:
    name: Raspberry Pi ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Create toolchain file
        run: |
          cat > arm64-toolchain.cmake << 'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF

      - name: Build Boost 1.85 for ARM64
        run: |
          BOOST_VER=1.85.0
          BOOST_UNDER=${BOOST_VER//./_}
          wget -q "https://archives.boost.io/release/${BOOST_VER}/source/boost_${BOOST_UNDER}.tar.bz2"
          tar -xjf "boost_${BOOST_UNDER}.tar.bz2"
          cd "boost_${BOOST_UNDER}"
          echo "using gcc : arm : aarch64-linux-gnu-g++ ;" > user-config.jam
          ./bootstrap.sh
          ./b2 --user-config=user-config.jam toolset=gcc-arm target-os=linux \
            architecture=arm address-model=64 --prefix=/tmp/boost-arm64 \
            --with-filesystem --with-thread --with-date_time --with-chrono \
            --with-regex --with-serialization --with-program_options \
            --with-coroutine --with-context --with-atomic install -j$(nproc)

      - name: Build
        id: build
        run: |
          xfg_ver=$(echo ${{ github.ref }} | sed 's|refs/tags/||')
          release_name="fuego-cli-raspberry-pi-arm64-v$xfg_ver"

          cmake -B build -DCMAKE_TOOLCHAIN_FILE=arm64-toolchain.cmake \
            -DBOOST_ROOT=/tmp/boost-arm64 -DCMAKE_BUILD_TYPE=Release
          make -C build -j$(nproc)

          mkdir "$release_name"
          for f in build/src/*; do
            [[ -x $f && -f $f ]] && aarch64-linux-gnu-strip "$f" && cp "$f" "$release_name/"
          done
          tar -czf "$release_name".tar.gz "$release_name"
          sha256=$(sha256sum "$release_name".tar.gz | awk '{print toupper($1)}')
          asset_path="./$release_name.tar.gz"
          echo "sha256=${sha256}" >> $GITHUB_OUTPUT
          echo "release_name=${release_name}.tar.gz" >> $GITHUB_OUTPUT
          echo "asset_path=${asset_path}" >> $GITHUB_OUTPUT
          echo "xfg_version=${xfg_ver}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.build.outputs.asset_path }}
          name: Fuego CLI Suite v${{ steps.build.outputs.xfg_version }}
          body: |
            [Download for Raspberry Pi](../../releases/download/${{ steps.build.outputs.xfg_version }}/${{ steps.build.outputs.release_name }}) **${{ steps.build.outputs.release_name }}**

            `SHA256 : ${{ steps.build.outputs.sha256 }}`
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
