name: Android Termux

on:
  push:
    tags:
      - "*"

jobs:
  build-android:
    name: Android Termux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            api: 21
            abi: arm64-v8a
          - arch: arm
            api: 21
            abi: armeabi-v7a
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential wget

      - name: Build Boost 1.85 for Android
        run: |
          BOOST_VER=1.85.0
          BOOST_UNDER=${BOOST_VER//./_}
          wget -q "https://archives.boost.io/release/${BOOST_VER}/source/boost_${BOOST_UNDER}.tar.bz2"
          tar -xjf "boost_${BOOST_UNDER}.tar.bz2"
          cd "boost_${BOOST_UNDER}"

          cat > user-config.jam << JAM_EOF
          using clang : android
          : \$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.arch }}-linux-android${{ matrix.api }}-clang++
          : <compileflags>-fPIC
            <compileflags>-frtti
            <compileflags>-fexceptions
            <archiver>\$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
            <ranlib>\$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
          ;
          JAM_EOF

          ./bootstrap.sh
          ./b2 --user-config=user-config.jam toolset=clang-android target-os=android \
            architecture=${{ matrix.arch == 'aarch64' && 'arm' || 'arm' }} \
            address-model=${{ matrix.arch == 'aarch64' && '64' || '32' }} \
            --prefix=/tmp/boost-android-${{ matrix.arch }} install -j$(nproc)

      - name: Create Android toolchain file
        run: |
          cat > android-toolchain.cmake << EOF
          set(CMAKE_SYSTEM_NAME Android)
          set(CMAKE_SYSTEM_VERSION ${{ matrix.api }})
          set(CMAKE_ANDROID_ARCH_ABI ${{ matrix.abi }})
          set(CMAKE_ANDROID_NDK \$ENV{ANDROID_NDK_ROOT})
          set(CMAKE_ANDROID_STL_TYPE c++_shared)
          EOF

      - name: Build
        id: build
        run: |
          xfg_ver=$(echo ${{ github.ref }} | sed 's|refs/tags/||')
          release_name="fuego-cli-android-${{ matrix.arch }}-v$xfg_ver"

          cmake -B build -DCMAKE_TOOLCHAIN_FILE=android-toolchain.cmake \
            -DBOOST_ROOT=/tmp/boost-android-${{ matrix.arch }} \
            -DCMAKE_BUILD_TYPE=Release
          make -C build -j$(nproc)

          mkdir "$release_name"
          if [[ -d build/src ]]; then
            for f in build/src/*; do
              [[ -x $f && -f $f ]] && cp "$f" "$release_name/"
            done
          fi
          tar -czf "$release_name".tar.gz "$release_name"
          sha256=$(sha256sum "$release_name".tar.gz | awk '{print toupper($1)}')
          asset_path="./$release_name.tar.gz"
          echo "sha256=${sha256}" >> $GITHUB_OUTPUT
          echo "release_name=${release_name}.tar.gz" >> $GITHUB_OUTPUT
          echo "asset_path=${asset_path}" >> $GITHUB_OUTPUT
          echo "xfg_version=${xfg_ver}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.build.outputs.asset_path }}
          name: Fuego CLI Suite v${{ steps.build.outputs.xfg_version }}
          body: |
            [Download for Termux](../../releases/download/${{ steps.build.outputs.xfg_version }}/${{ steps.build.outputs.release_name }}) **${{ steps.build.outputs.release_name }}**

            `SHA256 : ${{ steps.build.outputs.sha256 }}`
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
