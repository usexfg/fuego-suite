name: Windows Release

on:
  push:
    tags:
      - "*"

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1

      - name: Install OpenSSL
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files\OpenSSL",
            "C:\Program Files\FireDaemon OpenSSL 3"
          )
          $openssl = $candidates | Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
          if (-not $openssl) {
            $found = Get-ChildItem -Path "C:\Program Files" -Filter "ssl.h" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $openssl = (Get-Item $found.FullName).Directory.Parent.Parent.FullName }
          }
          if (-not $openssl) {
            choco install openssl -y --no-progress
            $openssl = $candidates | Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
            if (-not $openssl) {
              $found = Get-ChildItem -Path "C:\Program Files" -Filter "ssl.h" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $openssl = (Get-Item $found.FullName).Directory.Parent.Parent.FullName }
            }
          }
          if (-not $openssl) { throw "OpenSSL not found" }
          $inc = Join-Path $openssl "include"
          Write-Host "OPENSSL_ROOT_DIR=$openssl"
          Write-Host "OPENSSL_INCLUDE_DIR=$inc"
          echo "OPENSSL_ROOT_DIR=$openssl" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$inc" >> $env:GITHUB_ENV

      - name: Install Boost 1.85
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $Url = "https://archives.boost.io/release/1.85.0/binaries/boost_1_85_0-msvc-14.3-64.exe"
          Invoke-WebRequest -Uri $Url -OutFile "$env:TEMP\boost.exe" -UseBasicParsing
          Start-Process -Wait "$env:TEMP\boost.exe" -ArgumentList "/SILENT","/SP-","/SUPPRESSMSGBOXES","/DIR=C:\boost"
          echo "BOOST_ROOT=C:\boost" >> $env:GITHUB_ENV

      - name: Install jsoncpp
        shell: pwsh
        run: vcpkg install jsoncpp:x64-windows openssl:x64-windows

      - name: Build
        id: build
        shell: pwsh
        run: |
          $xfg_ver = "${{ github.ref_name }}"
          $release_name = "fuego-cli-win64-v$xfg_ver"

          $vcpkgDir = if (Test-Path "C:\vcpkg") { "C:\vcpkg" } else { "$env:VCPKG_INSTALLATION_ROOT" }
          $toolchain = Join-Path $vcpkgDir "scripts/buildsystems/vcpkg.cmake"
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build" `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DBOOST_ROOT="C:\boost" `
            -DBOOST_LIBRARYDIR="C:\boost\lib" `
            -DBOOST_INCLUDEDIR="C:\boost\include\boost-1_85" `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" `
            -DOPENSSL_INCLUDE_DIR="$env:OPENSSL_INCLUDE_DIR"
          cmake --build "${{ github.workspace }}/build" --config Release -j $env:NUMBER_OF_PROCESSORS

          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "build" "src" "Release"
          $zipName = "$release_name.zip"
          $zipPath = Join-Path $releaseDir $zipName
          $zipPathFwd = $zipPath -replace '\\', '/'
          Compress-Archive -Path (Join-Path $releaseDir "*.exe") -DestinationPath $zipPath
          $sha256 = (Get-FileHash $zipPath).Hash
          echo "sha256=$sha256" >> $env:GITHUB_OUTPUT
          echo "release_name=$zipName" >> $env:GITHUB_OUTPUT
          echo "asset_path=$zipPathFwd" >> $env:GITHUB_OUTPUT
          echo "xfg_version=$xfg_ver" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.build.outputs.asset_path }}
          name: Fuego CLI Suite v${{ steps.build.outputs.xfg_version }}
          body: |
            [Download for Windows](../../releases/download/${{ steps.build.outputs.xfg_version }}/${{ steps.build.outputs.release_name }}) **${{ steps.build.outputs.release_name }}**

            `SHA256 : ${{ steps.build.outputs.sha256 }}`
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
