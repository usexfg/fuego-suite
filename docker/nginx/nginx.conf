events {
    worker_connections 1024;
}

http {
    upstream fuego_node {
        server fuego-node:28180;
    }
    
    upstream fuego_wallet {
        server fuego-wallet:8070;
    }
    
    server {
        listen 80;
        server_name localhost;
        
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
        
        location /api/ {
            # Read-only node info only. Do NOT proxy unauthenticated write
            # endpoints; enable --restricted-rpc on the node and add auth here
            # before exposing /initiate, /placeorder, etc.
            proxy_pass http://fuego_node/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Wallet RPC holds spend keys — disabled by default.
        # Re-enable only behind TLS + HTTP basic auth / mTLS.
        # location /wallet/ {
        #     proxy_pass http://fuego_wallet/;
        #     auth_basic "wallet";
        #     auth_basic_user_file /etc/nginx/.htpasswd;
        # }
    }
}
