name: Push → Discord
on: [push]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post commit summary to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT: ${{ toJSON(github.event) }}
        run: |
          set -euo pipefail
          [[ -z "$WEBHOOK" ]] && { echo "DISCORD_WEBHOOK_URL secret not set" >&2; exit 1; }

          REPO=$(jq -r '.repository.full_name' <<<"$EVENT")
          REF=$(jq -r '.ref' <<<"$EVENT")
          BRANCH=${REF#refs/heads/}
          NUM=$(jq '.commits | length' <<<"$EVENT")

          # Build raw commit list for AI input
          jq -r '.commits[] | "\(.id[:7]) \(.message | split("\n")[0])"' <<<"$EVENT" > /tmp/ai-input.txt

          # Build formatted list for fallback/field
          DESC=""
          for c in $(jq -r '.commits[] | @base64' <<<"$EVENT"); do
            _jq() { echo "$c" | base64 -d | jq -r "$1"; }
            SHA=$(_jq '.id[:7]')
            MSG=$(_jq '.message' | head -1)
            NAME=$(_jq '.author.name // .author.username // "unknown"')
            [[ ${#MSG} -gt 80 ]] && MSG="${MSG:0:79}…"
            DESC+="\`$SHA\` $MSG — *$NAME*\n"
          done
          [[ ${#DESC} -gt 2000 ]] && DESC="${DESC:0:1999}…"

          # AI summarization
          AI_SUM=""
          if [[ -n "${GEMINI_KEY:-}" ]]; then
            PROMPT="Summarize these commits into one concise paragraph for a dev Discord channel. Mention the main theme and key changes:\n\n$(cat /tmp/ai-input.txt)"
            AI_SUM=$(jq -Rs --arg p "$PROMPT" '{contents:[{parts:[{text: ($p)}]}]}' \
              | curl -sf --max-time 15 -X POST \
                "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_KEY" \
                -H "Content-Type: application/json" -d @- \
              | jq -r '.candidates[0].content.parts[0].text // ""' 2>/dev/null || true)
          fi

          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          if [[ -n "$AI_SUM" ]]; then
            # Guard AI_SUM length for embed — max 2000 for description
            [[ ${#AI_SUM} -gt 1800 ]] && AI_SUM="${AI_SUM:0:1799}…"
            PAYLOAD=$(jq -c -n \
              --arg title "$REPO · $NUM new commit(s)" \
              --arg desc "$AI_SUM" \
              --arg raw "📋 Commits:\n${DESC}" \
              --arg url "https://github.com/$REPO/commits/$BRANCH" \
              --argjson color 3066993 \
              --arg ts "$TS" \
              --arg ft "$BRANCH" \
              '{embeds:[{title:$title,description:$desc,color:$color,url:$url,footer:{text:$ft},timestamp:$ts,fields:[{name:"Details",value:$raw,inline:false}]}]}')
          else
            PAYLOAD=$(jq -c -n \
              --arg title "$REPO · $NUM new commit(s)" \
              --arg desc "$DESC" \
              --arg url "https://github.com/$REPO/commits/$BRANCH" \
              --argjson color 3066993 \
              --arg ts "$TS" \
              --arg ft "$BRANCH" \
              '{embeds:[{title:$title,description:$desc,url:$url,color:$color,footer:{text:$ft},timestamp:$ts}]}')
          fi

          curl -sf -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD" >/dev/null
          echo "posted $NUM commit(s) for $REPO"
